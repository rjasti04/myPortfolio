<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Open Graph card — Arcade</title>
  <link rel="stylesheet" href="card.css">
  <style>
    /* Tokens lifted from :root in frontend/arcade.css. */
    .card {
      background: #06060f;
      color: #e8e8ff;
    }

    .glow-violet {
      width: 720px;
      height: 720px;
      top: -320px;
      left: -180px;
      background: radial-gradient(circle, rgba(165, 94, 234, 0.34), transparent 66%);
    }

    .glow-cyan {
      width: 560px;
      height: 560px;
      bottom: -280px;
      right: -120px;
      background: radial-gradient(circle, rgba(46, 230, 197, 0.20), transparent 66%);
    }

    /* The scanline wash the page itself wears, at card scale. */
    .scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom,
          rgba(0, 0, 0, 0) 0,
          rgba(0, 0, 0, 0) 3px,
          rgba(0, 0, 0, 0.26) 4px,
          rgba(0, 0, 0, 0.26) 6px);
      opacity: 0.5;
    }

    .rule {
      background: linear-gradient(90deg, #2ee6c5, #ff4fa3);
    }

    .eyebrow {
      color: #2ee6c5;
    }

    .left {
      width: 620px;
    }

    .title {
      font-size: 86px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 0 0 26px rgba(46, 230, 197, 0.45);
      color: #2ee6c5;
    }

    .lead {
      color: #8b8bb5;
      max-width: 580px;
    }

    .chip {
      background: #16162c;
      border-color: #2a2a4a;
      color: #e8e8ff;
    }

    .chip.pink {
      background: rgba(255, 79, 163, 0.16);
      border-color: rgba(255, 79, 163, 0.45);
      color: #ff4fa3;
    }

    .art {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .footer {
      border-top: 1px solid #2a2a4a;
    }

    .footer .url {
      color: #e8e8ff;
    }

    .footer .meta {
      color: #8b8bb5;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="glow glow-violet"></div>
    <div class="glow glow-cyan"></div>

    <div class="body">
      <div class="left">
        <div class="rule"></div>
        <div class="eyebrow">Four games, no framework</div>
        <h1 class="title">Arcade</h1>
        <p class="lead">2048, Tetris, Flapper and Stack &mdash; written from
          scratch in vanilla JavaScript. Keyboard or touch, scores kept in
          your own browser.</p>
        <div class="chips">
          <span class="chip">Canvas</span>
          <span class="chip">No dependencies</span>
          <span class="chip pink">Best scores stay local</span>
        </div>
      </div>

      <!-- One motif per game, drawn the way each game draws itself: a merged
           2048 tile, an S-piece, the orb and its gap, and a trimmed tower. -->
      <div class="art">
        <svg width="330" height="330" viewBox="0 0 330 330" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="156" height="156" rx="16" fill="#0e0e1d" stroke="#2a2a4a" stroke-width="2" />
          <rect x="26" y="26" width="50" height="50" rx="8" fill="#2f6f9e" />
          <rect x="84" y="26" width="50" height="50" rx="8" fill="#43b04a" />
          <rect x="26" y="84" width="50" height="50" rx="8" fill="#e5c53a" />
          <rect x="84" y="84" width="50" height="50" rx="8" fill="#f0932b" />

          <rect x="172" y="2" width="156" height="156" rx="16" fill="#0e0e1d" stroke="#2a2a4a" stroke-width="2" />
          <rect x="228" y="42" width="42" height="42" rx="6" fill="#4ade80" />
          <rect x="270" y="42" width="42" height="42" rx="6" fill="#4ade80" />
          <rect x="186" y="84" width="42" height="42" rx="6" fill="#4ade80" />
          <rect x="228" y="84" width="42" height="42" rx="6" fill="#4ade80" />

          <rect x="2" y="172" width="156" height="156" rx="16" fill="#0e0e1d" stroke="#2a2a4a" stroke-width="2" />
          <rect x="104" y="190" width="34" height="52" rx="8" fill="#1b6f7d" />
          <rect x="104" y="278" width="34" height="34" rx="8" fill="#1b6f7d" />
          <circle cx="52" cy="256" r="18" fill="#facc15" />
          <circle cx="46" cy="250" r="6" fill="rgba(255, 255, 255, 0.75)" />

          <rect x="172" y="172" width="156" height="156" rx="16" fill="#0e0e1d" stroke="#2a2a4a" stroke-width="2" />
          <rect x="196" y="286" width="108" height="22" rx="5" fill="#2ee6c5" />
          <rect x="206" y="258" width="88" height="22" rx="5" fill="#3ac9d8" />
          <rect x="216" y="230" width="68" height="22" rx="5" fill="#5aa8e8" />
          <rect x="236" y="202" width="48" height="22" rx="5" fill="#a55eea" />
        </svg>
      </div>
    </div>

    <div class="footer">
      <span class="url">rjasti.com/arcade</span>
      <span class="meta">2048 &bull; Tetris &bull; Flapper &bull; Stack</span>
    </div>
    <div class="scanlines"></div>
  </div>
</body>

</html>
