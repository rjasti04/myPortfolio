[pytest]
# There was no pytest configuration at all, so every one of these was inherited
# from whatever versions happened to be installed.
#
# asyncio_mode: pytest-asyncio's mode was never declared. The suite marks async
# tests explicitly, which is strict mode - stated here rather than assumed.
#
# An async test that loses its @pytest.mark.asyncio is a hard failure under the
# pinned pytest 9, not a silent skip. That is a property of the pin rather than
# of this file: it is one of the behaviours server/requirements-dev.txt exists
# to hold still.
asyncio_mode = strict
testpaths = tests/backend tests/evals tests/tooling

# --strict-markers turns a typo'd marker into an error instead of a warning;
# --strict-config does the same for an unknown key in this file.
addopts = --strict-markers --strict-config

filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
    error::pytest.PytestReturnNotNoneWarning
