# Dependabot keeps the three dependency surfaces of this repo current: the npm
# packages at the root, the Python requirements the API server installs, and the
# actions the workflows pin by commit SHA (each with its release in a comment).
#
# Note that npm updates do NOT reach `frontend/vendor/`. Those files are copied
# out of node_modules by hand (see frontend/vendor/README.md); after merging a
# bump for `dompurify` or `marked`, re-run the copy or the shipped bundle stays
# on the old version.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Build, lint and test tools, plus the three packages whose bytes ship
      # (dompurify, marked, Font Awesome). One PR per week is easier to review
      # than a stream of one-line bumps; the shipped three still need the
      # vendor re-copy above, which build.test.js now enforces.
      dev-tooling:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
