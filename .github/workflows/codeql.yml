# Static analysis for the JavaScript and Python in this repository.
#
# The existing pipeline lints and tests but has no security scanning: nothing
# looks for injection sinks, unsafe deserialisation or hardcoded credentials.
# CodeQL runs on GitHub's infrastructure and does not touch the deploy path.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published queries reach an unchanged main branch.
    - cron: '17 4 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      # The action reads the workflow run it is part of
      # (GET /repos/{owner}/{repo}/actions/runs/{run_id}). Without this the
      # analysis completes and then the job fails with "Resource not accessible
      # by integration" and reports a configuration error - which is exactly how
      # the first run of this workflow failed.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # `languages`, plural. `language` is not an input, so it was ignored
          # silently - the run logged "Unexpected input(s) 'language'" and then
          # auto-detected instead, making both matrix jobs analyse every
          # language and upload overlapping results.
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
