name: Continuous Agent & Chat Evals

on:
  pull_request:
    paths:
      - 'server/services/bedrock_service.py'
      - 'server/config/resume_context.py'
      - 'content/resume.json'
      - 'tests/evals/**'
  push:
    branches:
      - main
    paths:
      - 'server/services/bedrock_service.py'
      - 'server/config/resume_context.py'
      - 'content/resume.json'
      - 'tests/evals/**'

# Least privilege for GITHUB_TOKEN: this workflow only reads the repository.
# Actions are pinned to commit SHAs; see deploy.yml for why.
permissions:
  contents: read

jobs:
  eval-chat-persona:
    name: Chat Persona & Prompt Safety Evals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: server/requirements*.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r server/requirements-dev.txt

      - name: Run Persona & Prompt Safety Evals
        run: pytest tests/evals/
        env:
          PYTHONPATH: .
          TESTING: 'true'
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          AWS_REGION: 'us-east-1'
          DEFAULT_MODEL_ID: 'anthropic.claude-3-5-sonnet-20241022-v2:0'
          JWT_SECRET: 'ci-eval-dummy-jwt-secret-at-least-32-chars-long'
