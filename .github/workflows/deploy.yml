name: CI/CD Pipeline

on:
  # Restricted to main. Previously '**' matched every branch, so any commit on a
  # branch with an open pull request ran the whole matrix twice - once for the
  # push and once for the pull_request - doubling CI cost for no extra signal.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─── 1. FRONTEND QUALITY GATE ─────────────────────────────────────────
  frontend-check:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    # 20, not 10. Headroom to catch a hang, not a schedule for npm to meet: the
    # real work here is seconds (see Install Dependencies), and the two things
    # that can still block are registry calls nothing in this repository
    # controls. Ten minutes was tight enough that one slow afternoon cancelled
    # the job outright - and a cancelled quality gate skips the deploy, so a
    # slow registry silently cost a release.
    timeout-minutes: 20
    # Superseded runs on the same branch are cancelled. Safe here, unlike the
    # deploy job, because nothing these jobs do is stateful.
    concurrency:
      group: frontend-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # --no-audit is what makes this step fast, and it is not a weakening of
      # anything: `npm ci` runs its own security audit by default, against the
      # same registry advisory endpoint the dedicated Audit step below calls a
      # minute later. That implicit audit is the step's entire cost. Run #193
      # restored a 19 MB cache hit - every tarball local, nothing to download -
      # and npm still reported "added 231 packages in 2m". Measured off the
      # same lockfile and a warm cache, `npm ci` is 5m42s with the audit and
      # 3.0s without it.
      #
      # So the frontend gate was paying for the same advisory lookup twice per
      # run, and only the second one was ever reported. On the afternoon the
      # endpoint went slow that doubled cost blew the job's budget: 7m01s here
      # plus 2m38s in the Audit step, past ten minutes, run cancelled, deploy
      # skipped. Auditing belongs in the explicit step - it is bounded, its
      # result is visible, and continue-on-error makes it non-blocking. Here it
      # is duplicated work on the critical path. --no-fund drops one more
      # registry round trip that prints a line nobody reads.
      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Run JavaScript & CSS Linters
        run: npm run lint

      - name: Run Frontend Tests (JSDOM)
        run: npm test

      # index.html pins its inline scripts by sha256 in the CSP. Editing one -
      # even reindenting it - invalidates the hash and the browser then refuses
      # to run it silently. One of them is the theme bootstrap, so the only
      # symptom is the flash-of-wrong-theme it exists to prevent. Nothing else
      # in this pipeline would catch that.
      # Builds dist/ here so a build failure is caught by the quality gate
      # rather than mid-deploy, and so the CSP check below sees the built page
      # as well as the source.
      - name: Build Frontend
        run: npm run build

      - name: Verify CSP Inline-Script Hashes
        run: python3 scripts/check_csp_hashes.py

      # The docs carry numbers an agent budgets against - file sizes, grep
      # yields, per-module line counts - and every one of them decayed silently
      # as the code grew. When this check was added the navigation table in
      # AGENTS.md understated every file by 14-39%, all in the direction that
      # makes a reader under-budget. Prose stays right because a wrong sentence
      # is obvious; a wrong number is not. Runs after the build so it sees the
      # same tree the rest of the gate does.
      #
      # Fails with the corrected values; `--fix` applies them locally.
      - name: Verify Documentation Counts
        run: python3 scripts/check_docs.py

      # content/resume.json is the source of truth for the biography that used
      # to be typed into five files. A hand-edit to a generated region fails
      # here rather than silently becoming the next drift.
      - name: Verify Generated Resume Copies
        run: python3 scripts/generate_resume.py --check

      # `npm run audit` existed from the start and was never called by CI. It
      # currently reports high-severity advisories in the dev toolchain
      # (postcss, ws, via stylelint and jsdom). Not blocking, because a
      # transitive dev advisory should not stop a portfolio deploy, but it has
      # to be visible rather than silently unrun.
      #
      # Bounded independently of the job. This step is the last one to run, so
      # whenever the job overran it was the step holding the clock when the
      # deadline arrived - reported as "The operation was canceled" under `npm
      # audit`, which reads like an audit failure and is not one. `npm audit`
      # reaches the registry's advisory endpoint and, when that endpoint is
      # slow, sits through npm's own retry budget - 300s per attempt over two
      # retries by default, so roughly a quarter of an hour on a job that had
      # ten minutes. Cut to 60s over one retry it gives up in 2m00s, measured
      # against an endpoint that never answers, well inside the 3-minute cap
      # below. A step timeout is a step failure, which
      # continue-on-error already absorbs: an unreachable advisory endpoint now
      # leaves a red-x annotation on an otherwise green job instead of taking
      # the deploy down with it.
      - name: Audit npm Dependencies
        run: npm run audit
        continue-on-error: true
        timeout-minutes: 3
        env:
          npm_config_fetch_timeout: '60000'
          npm_config_fetch_retries: '1'

  # ─── 2. BACKEND QUALITY GATE ──────────────────────────────────────────
  backend-check:
    name: Backend Lint & Pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: backend-check-${{ matrix.python-version }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # The host's interpreter version is not pinned by this repository, so
        # testing only the lower bound left the upper end unverified. The lock
        # is resolved --universal precisely so one set of pins covers both; this
        # is what proves it.
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: server/requirements*.txt

      # requirements-dev.txt is a superset of requirements.txt resolved in one
      # pass, so CI can never test against a different version of a shared
      # package than production installs. --require-hashes makes an unpinned or
      # substituted artifact a hard failure rather than a silent upgrade.
      - name: Install Pinned Backend & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r server/requirements-dev.txt

      # The backend had no linting while the frontend had two linters. F821
      # alone would have caught the five auth routes that shipped calling
      # service functions that do not exist.
      - name: Lint Backend (ruff)
        run: ruff check server tests

      - name: Run Backend Pytest Suite
        run: pytest --cov=server --cov-report=term-missing --cov-fail-under=55
        env:
          PYTHONPATH: .
          TESTING: 'true'
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          AWS_REGION: 'us-east-1'
          DEFAULT_MODEL_ID: 'google.gemma-3-4b-it'
          # Test-only signing key. Production reads JWT_SECRET from the
          # service environment on the host; there is no longer a fallback.
          JWT_SECRET: 'ci-only-jwt-secret-not-used-by-any-deployment'

  # ─── 3. MIGRATIONS & SCHEMA DRIFT ─────────────────────────────────────
  migration-check:
    name: Migrations & Schema Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: migration-check-${{ github.ref }}
      cancel-in-progress: true

    # The suite builds its schema with Base.metadata.create_all against SQLite,
    # so migrations were never executed by any test and a model that had drifted
    # from its migration was only discovered by `alembic upgrade head` running
    # against production. This job runs them against the real engine instead.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rjwebapp
          POSTGRES_PASSWORD: rjwebapp
          POSTGRES_DB: rjwebapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rjwebapp -d rjwebapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://rjwebapp:rjwebapp@localhost:5432/rjwebapp

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: server/requirements*.txt

      - name: Install Pinned Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r server/requirements.txt

      - name: Assert a Single Migration Head
        working-directory: server
        run: |
          heads=$(PYTHONPATH=.. alembic heads | grep -c '(head)' || true)
          echo "heads: $heads"
          if [ "$heads" -ne 1 ]; then
            echo "::error::expected exactly one migration head, found $heads"
            PYTHONPATH=.. alembic heads
            exit 1
          fi

      - name: Apply Migrations
        working-directory: server
        run: PYTHONPATH=.. alembic upgrade head

      # The real payoff: alembic compares the models against the schema the
      # migrations just built and fails if they disagree, so a model changed
      # without a migration cannot reach the deploy step.
      - name: Detect Model / Migration Drift
        working-directory: server
        run: PYTHONPATH=.. alembic check

      - name: Verify Migrations Are Reversible
        working-directory: server
        run: |
          PYTHONPATH=.. alembic downgrade base
          PYTHONPATH=.. alembic upgrade head

  # ─── 3. PRODUCTION DEPLOYMENT (Gated by Test Success) ─────────────────
  deploy:
    name: Deploy Frontend and Backend to EC2
    needs: [frontend-check, backend-check, migration-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Serialises deploys. Two merges in quick succession previously ran two
    # `rsync --delete` passes and two `alembic upgrade head` invocations against
    # the same host at the same time. Queue rather than cancel: interrupting a
    # half-finished migration or file sync is worse than waiting.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USERNAME }}
      # Single source of truth for the remote layout: the rsync targets below
      # and every remote script are driven from these, so a snapshot can never
      # back up a different directory than the deploy overwrites.
      REMOTE_APP_DIR: /home/${{ secrets.EC2_USERNAME }}/fastapi
      WEB_ROOT: /var/www/html
      HEALTH_URL: ${{ vars.HEALTH_CHECK_URL || 'https://rjasti.com/api/health' }}

    steps:
      - name: Checkout the Tested Commit
        uses: actions/checkout@v4
        with:
          # Pin to the commit that triggered this run. Checking out the branch
          # would deploy whatever main points at when the job starts, which is
          # not necessarily what the quality gates just passed.
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -n "${{ secrets.EC2_HOST_KEY }}" ]; then
            # Pinned: the deploy will refuse to talk to anything else.
            printf '%s\n' "${{ secrets.EC2_HOST_KEY }}" >> ~/.ssh/known_hosts
            echo "Using the pinned host key"
          else
            # Trust-on-first-use, every run: whatever answers on that address is
            # accepted. Set the EC2_HOST_KEY secret to close this - capture it
            # with: ssh-keyscan -H <host>
            echo "::warning::EC2_HOST_KEY is not set; falling back to ssh-keyscan (trust on first use)"
            ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          fi

      # Everything below this point is recoverable: the previous release is on
      # disk before a single byte is overwritten.
      - name: Snapshot Current Release for Rollback
        run: |
          ssh "$EC2_USER@$EC2_HOST" bash -se -- "$REMOTE_APP_DIR" "$WEB_ROOT" <<'REMOTE'
          set -euo pipefail
          APP_DIR="$1"
          WEB_ROOT="$2"
          BACKUP_DIR="$APP_DIR/../deploy-backups"
          mkdir -p "$APP_DIR/server" "$BACKUP_DIR"

          # Timestamped, and `current` points at the newest. This used to write
          # to a single server.prev/html.prev pair, so rollback reached exactly
          # one release back: two bad deploys in a row and the last good release
          # was overwritten by the first bad one, leaving nothing to roll back
          # to but a manual redeploy from a git ref.
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          SNAP="$BACKUP_DIR/$STAMP"
          mkdir -p "$SNAP"

          rsync -a --delete "$APP_DIR/server/" "$SNAP/server/"
          sudo rsync -a --delete "$WEB_ROOT/" "$SNAP/html/"

          # Recorded so a failed deploy can report which revision the schema
          # was on before migrations ran.
          if [ -x "$APP_DIR/.venv/bin/alembic" ] && [ -f "$APP_DIR/server/alembic.ini" ]; then
            (cd "$APP_DIR/server" && "$APP_DIR/.venv/bin/alembic" current \
              > "$SNAP/alembic-revision" 2>/dev/null) || true
          fi

          # `current` is what the rollback step restores from; the timestamped
          # directories behind it are what make going back further possible.
          ln -sfn "$SNAP" "$BACKUP_DIR/current.new"
          mv -Tf "$BACKUP_DIR/current.new" "$BACKUP_DIR/current"

          # Keep ten. Anything older is not worth the disk.
          ls -1d "$BACKUP_DIR"/20*/ 2>/dev/null | sort -r | tail -n +11 | while read -r old; do
            echo "Pruning old snapshot: $old"
            sudo rm -rf "$old"
          done

          echo "Snapshot written to $SNAP"
          echo "Available rollback points:"
          ls -1d "$BACKUP_DIR"/20*/ 2>/dev/null | sort -r | head -10 || true
          REMOTE
          echo "DEPLOY_SNAPSHOT=ok" >> "$GITHUB_ENV"

      # `rsync --delete` mirrors the source, so an empty or wrong source
      # directory does not fail - it deletes the destination. The frontend sync
      # targets Apache's document root, where that would take the site down.
      # The frontend is deployed from dist/, so it has to exist before the
      # emptiness check below - which is the guard that stops `rsync --delete`
      # mirroring an empty directory over the live document root.
      # --no-audit --no-fund for the reason spelled out on the quality gate's
      # install step: the audit `npm ci` runs by default is a registry call
      # that can take minutes and is already covered there. This job has no
      # audit step of its own - it deploys a commit the gate has already
      # audited - so here the call buys nothing at all, on a job holding the
      # production-deploy concurrency lock.
      - name: Build Frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Verify Deploy Sources Are Not Empty
        run: |
          for dir in server dist; do
            count=$(find "$dir" -type f | head -20 | wc -l)
            if [ "$count" -lt 5 ]; then
              echo "::error::$dir/ has only $count files - refusing to mirror that over the live deployment"
              exit 1
            fi
            echo "$dir/ looks populated ($count+ files)"
          done
          test -f dist/index.html || { echo "::error::dist/index.html is missing"; exit 1; }
          test -d dist/assets || { echo "::error::dist/assets is missing - the build did not run"; exit 1; }

      - name: Deploy FastAPI Backend (server/)
        run: |
          # Sync server directory to EC2, excluding virtual environments, secrets, and caches
          rsync -avz --delete \
            --exclude=".venv" \
            --exclude="venv" \
            --exclude="__pycache__" \
            --exclude=".env*" \
            --exclude=".git" \
            server/ "$EC2_USER@$EC2_HOST:$REMOTE_APP_DIR/server/"

      - name: Deploy Static Frontend to Apache (/var/www/html/)
        run: |
          # Deploys the build output, not the source tree: minified, bundled and
          # content-hashed. `frontend/` remains the source of truth and stays
          # runnable on its own for development.
          #
          # Node's setup step is in the quality gate, so this job runs its own
          # build above.
          rsync -avz --delete \
            --rsync-path="sudo rsync" \
            dist/ "$EC2_USER@$EC2_HOST:$WEB_ROOT/"

      - name: Install Dependencies and Run Migrations
        run: |
          ssh "$EC2_USER@$EC2_HOST" bash -se -- "$REMOTE_APP_DIR" <<'REMOTE'
          set -euo pipefail
          APP_DIR="$1"

          # Same hash-checked lock CI tested against.
          "$APP_DIR/.venv/bin/pip" install --require-hashes \
            -r "$APP_DIR/server/requirements.txt"

          # An SSH command does not inherit the environment systemd gives the
          # service. alembic/env.py loads .env directly via python-dotenv,
          # avoiding shell-sourcing errors from unquoted env variables.

          cd "$APP_DIR/server"
          "$APP_DIR/.venv/bin/alembic" upgrade head
          REMOTE

      - name: Restart FastAPI and HTTPD Services
        run: |
          ssh "$EC2_USER@$EC2_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          sudo systemctl restart fastapi.service
          sudo systemctl restart httpd
          REMOTE

      # A restart that returns 0 only means systemd accepted the unit, not that
      # the app came up. An import-time failure - a missing JWT_SECRET, say -
      # exits after systemd has already reported success, which used to leave
      # the site down behind a green checkmark.
      - name: Verify Deployment Health
        run: |
          ssh "$EC2_USER@$EC2_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          for unit in fastapi.service httpd; do
            if ! systemctl is-active --quiet "$unit"; then
              echo "::error::$unit is not active after restart"
              systemctl status "$unit" --no-pager -l | tail -40 || true
              journalctl -u "$unit" -n 60 --no-pager || true
              exit 1
            fi
            echo "$unit is active"
          done
          REMOTE

          echo "Probing $HEALTH_URL"
          MAX_ATTEMPTS=12
          healthy=0
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if body="$(curl -fsS --max-time 10 "$HEALTH_URL")"; then
              if printf '%s' "$body" | grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"'; then
                echo "Healthy after ${attempt} attempt(s): $body"
                healthy=1
                break
              fi
              echo "Attempt ${attempt}/${MAX_ATTEMPTS}: reachable but not healthy -> $body"
            else
              echo "Attempt ${attempt}/${MAX_ATTEMPTS}: no healthy response yet"
            fi
            sleep 5
          done

          if [ "$healthy" -ne 1 ]; then
            echo "::error::$HEALTH_URL never reported status=ok; rolling back"
            exit 1
          fi

      # /health only runs `SELECT 1`. It cannot tell you whether Apache is
      # serving the new frontend, or whether the /api prefix still routes -
      # the two things a deploy is most likely to break. A green health check
      # with a stale or half-synced document root looks identical to success.
      #
      # Deliberately read-only: nothing here writes to the production database.
      - name: Smoke Test the Deployed Site
        run: |
          SITE_URL="${HEALTH_URL%/api/health}"
          echo "Smoke testing $SITE_URL"
          failed=0

          # 1. The document root serves the app shell.
          code="$(curl -fsS -o /tmp/index.out -w '%{http_code}' --max-time 15 "$SITE_URL/" || echo 000)"
          if [ "$code" != "200" ]; then
            echo "::error::GET / returned $code"; failed=1
          else
            echo "GET / -> 200"
          fi

          # 2. The frontend that landed is the one this run built. sw.js carries
          #    a CACHE_NAME bumped per release, so comparing it proves the rsync
          #    actually replaced the document root rather than half-failing.
          # Read from the build output: the version is derived from the built
          # asset set, so the source file no longer carries the deployed value.
          expected="$(grep -oE "rj-portfolio-[a-z0-9]+" dist/sw.js | head -1)"
          served="$(curl -fsS --max-time 15 "$SITE_URL/sw.js" | grep -oE "rj-portfolio-[a-z0-9]+" | head -1 || true)"
          if [ -n "$expected" ] && [ "$expected" != "$served" ]; then
            echo "::error::deployed sw.js is $served, expected $expected - the frontend sync did not land"
            failed=1
          else
            echo "sw.js cache version -> $served"
          fi

          # 3. The /api prefix routes. main.py mounts every router twice
          #    precisely because whether Apache strips /api decides which copy
          #    serves production, and getting that wrong is an outage that
          #    /health alone would not reveal if it were probed on the root mount.
          code="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/api/health" || echo 000)"
          if [ "$code" != "200" ]; then
            echo "::error::GET /api/health returned $code - prefix routing is broken"; failed=1
          else
            echo "GET /api/health -> 200"
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error::smoke test failed; rolling back"
            exit 1
          fi
          echo "Smoke test passed"

      # Restores the previous code on both tiers and brings the services back.
      # The database is deliberately NOT downgraded: `alembic downgrade` can
      # drop columns and lose rows, so migrations must stay backward-compatible
      # with the release before them (expand now, contract in a later deploy).
      - name: Roll Back Failed Deployment
        if: failure() && env.DEPLOY_SNAPSHOT == 'ok'
        run: |
          echo "::warning::Deployment failed - restoring the previous release"
          ssh "$EC2_USER@$EC2_HOST" bash -se -- "$REMOTE_APP_DIR" "$WEB_ROOT" <<'REMOTE'
          set -euo pipefail
          APP_DIR="$1"
          WEB_ROOT="$2"
          BACKUP_DIR="$APP_DIR/../deploy-backups"
          SNAP="$(readlink -f "$BACKUP_DIR/current")"

          if [ -z "$SNAP" ] || [ ! -d "$SNAP/server" ]; then
            echo "::error::No usable snapshot at $BACKUP_DIR/current - cannot roll back automatically"
            ls -1d "$BACKUP_DIR"/20*/ 2>/dev/null | sort -r | head -10 || true
            exit 1
          fi
          echo "Restoring from $SNAP"

          rsync -a --delete "$SNAP/server/" "$APP_DIR/server/"
          sudo rsync -a --delete "$SNAP/html/" "$WEB_ROOT/"

          "$APP_DIR/.venv/bin/pip" install --require-hashes \
            -r "$APP_DIR/server/requirements.txt"

          sudo systemctl restart fastapi.service
          sudo systemctl restart httpd

          if [ -f "$SNAP/alembic-revision" ]; then
            echo "Schema revision before this deploy:"
            cat "$SNAP/alembic-revision"
          fi
          echo "Older rollback points, if this one is also bad:"
          ls -1d "$BACKUP_DIR"/20*/ 2>/dev/null | sort -r | head -10 || true
          echo "Code rolled back. The database schema was NOT downgraded - if this"
          echo "deploy applied a migration, verify it is compatible with the"
          echo "restored release."
          REMOTE

      - name: Confirm Rollback Restored Service
        if: failure() && env.DEPLOY_SNAPSHOT == 'ok'
        run: |
          for attempt in $(seq 1 6); do
            if curl -fsS --max-time 10 "$HEALTH_URL" \
                 | grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "::notice::Rollback succeeded - $HEALTH_URL is healthy again"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Rollback did not restore a healthy service - manual intervention required"
          exit 1
