name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  # ─── 1. FRONTEND QUALITY GATE ─────────────────────────────────────────
  frontend-check:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run JavaScript & CSS Linters
        run: npm run lint

      - name: Run Frontend Tests (JSDOM)
        run: npm test

  # ─── 2. BACKEND QUALITY GATE ──────────────────────────────────────────
  backend-check:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest pytest-asyncio httpx aiosqlite

      - name: Run Backend Pytest Suite
        run: pytest tests/backend/
        env:
          PYTHONPATH: .
          TESTING: 'true'
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          AWS_REGION: 'us-east-1'
          DEFAULT_MODEL_ID: 'google.gemma-3-4b-it'

  # ─── 3. PRODUCTION DEPLOYMENT (Gated by Test Success) ─────────────────
  deploy:
    name: Deploy Frontend and Backend to EC2
    needs: [frontend-check, backend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy FastAPI Backend (server/)
        run: |
          # Ensure target directory exists on EC2
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "mkdir -p /home/${{ secrets.EC2_USERNAME }}/fastapi/server"
          
          # Sync server directory to EC2, excluding virtual environments, secrets, and caches
          rsync -avz --delete \
            --exclude=".venv" \
            --exclude="venv" \
            --exclude="__pycache__" \
            --exclude=".env*" \
            --exclude=".git" \
            server/ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USERNAME }}/fastapi/server/

      - name: Deploy Static Frontend to Apache (/var/www/html/)
        run: |
          # Sync static frontend files to Apache's document root
          # Uses sudo rsync because /var/www/html/ is owned by root/apache
          rsync -avz --delete \
            --rsync-path="sudo rsync" \
            --exclude="tests" \
            frontend/ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/var/www/html/

      - name: Restart FastAPI and HTTPD Services
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "
            # Install any new dependencies
            /home/${{ secrets.EC2_USERNAME }}/fastapi/.venv/bin/pip install -r /home/${{ secrets.EC2_USERNAME }}/fastapi/server/requirements.txt
            
            # Run database migrations
            cd /home/${{ secrets.EC2_USERNAME }}/fastapi/server && ../.venv/bin/alembic upgrade head

            # Restart the FastAPI service
            sudo systemctl restart fastapi.service
            
            # Restart the Apache HTTPD service
            sudo systemctl restart httpd
          "
