name: Weekly AI Health & Security Audit

on:
  schedule:
    # Runs every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: this workflow only reads the repository.
# Actions are pinned to commit SHAs; see deploy.yml for why.
permissions:
  contents: read

jobs:
  codebase-audit:
    name: Weekly Codebase & Security Health Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: server/requirements*.txt

      # The full audit stays advisory (dev tooling carries transitive
      # advisories that should not redden the week); the shipped packages are
      # held to it, as in deploy.yml.
      - name: Install Frontend Tools & Audit
        run: |
          npm ci --no-audit --no-fund
          npm run audit || true
          npm audit --omit=dev --audit-level=high
          npm run lint

      - name: Install Backend Dependencies, Audit & Lint
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r server/requirements-dev.txt
          pip-audit -r server/requirements.txt --require-hashes --disable-pip --progress-spinner off
          ruff check server tests

      - name: Run Backend Pytest Suite
        run: pytest --cov=server --cov-report=term-missing --cov-fail-under=55
        env:
          PYTHONPATH: .
          TESTING: 'true'
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          AWS_REGION: 'us-east-1'
          DEFAULT_MODEL_ID: 'google.gemma-3-4b-it'
          JWT_SECRET: 'ci-only-jwt-secret-not-used-by-any-deployment'

      - name: Verify CSP Hashes
        run: python3 scripts/check_csp_hashes.py

      - name: Verify Documentation Token & Line Counts
        run: python3 scripts/check_docs.py

      - name: Verify Agent Configuration
        run: python3 scripts/check_agent_config.py
